name: IndexNow Submit

'on':
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Run IndexNow submit script
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}
        run: node .github/scripts/indexnow.js
